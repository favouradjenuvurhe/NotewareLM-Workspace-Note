<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NotewareLM Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { margin:0; font-family: Arial; background:#0f0f0f; color:#fff; padding:20px;}
.note-item { background:#1c1c1c; padding:15px; margin-bottom:10px; border-radius:8px; cursor:pointer; }
.note-item h3{margin:0;}
#addBtn { position:fixed; bottom:20px; right:20px; background:#7c3aed; color:#fff; border:none; border-radius:50%; width:55px; height:55px; font-size:28px; cursor:pointer;}
</style>
</head>
<body>

<h2>Your Notes</h2>
<div id="noteList"></div>
<button id="addBtn">+</button>

<script>
let notes = JSON.parse(localStorage.getItem("notes") || "[]");
function renderNotes(){
  const list = document.getElementById("noteList");
  list.innerHTML="";
  notes.forEach(n=>{
    const div = document.createElement("div");
    div.className="note-item";
    div.innerHTML=`<h3>${n.title}</h3><p>${n.content[0] || ""}</p>`;
    div.onclick=()=>{ 
      localStorage.setItem("activeNote", n.id);
      window.location.href="view.html";
    };
    list.appendChild(div);
  });
}
renderNotes();

document.getElementById("addBtn").onclick=()=>{
  window.location.href="chat.html";
}
</script>

</body>
</html>
