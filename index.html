<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NotewareLM</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<style>
body {
  background: #ffffff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
</style>
</head>

<body>

<div id="app" class="w-full min-h-screen bg-white relative overflow-hidden">

<!-- Header -->
<div class="px-6 pt-6">
  <h1 class="text-xl font-bold">NotewareLM</h1>
</div>

<!-- Search -->
<div class="px-6 mt-4">
  <div class="flex items-center bg-gray-100 rounded-2xl px-4 py-3 gap-3">
    <i data-lucide="search" class="w-5 h-5 text-gray-500"></i>
    <input
      v-model="searchQuery"
      type="text"
      placeholder="Search notes..."
      class="bg-transparent outline-none flex-1 text-gray-600 placeholder-gray-400"
    />
    <i data-lucide="sliders-horizontal" class="w-5 h-5 text-gray-600"></i>
  </div>
</div>

<!-- Active (Hidden if empty) -->
<div v-if="activeNotes.length" class="px-6 mt-6">
  <h2 class="font-semibold text-gray-800 mb-3">Active</h2>
  <div class="flex gap-4 overflow-x-auto pb-2">

    <div
      v-for="note in activeNotes"
      :key="note.id"
      class="flex-shrink-0 cursor-pointer"
      @click="openNote(note)"
    >
      <div class="w-14 h-14 rounded-full p-[2px] bg-gray-300">
        <img :src="note.avatar" class="w-full h-full rounded-full object-cover">
      </div>
    </div>

  </div>
</div>

<!-- Home Section -->
<div class="px-6 mt-4 overflow-y-auto pb-28">
  <h2 class="font-semibold text-gray-800 mb-2">Home</h2>

  <!-- Empty State -->
  <div
    v-if="filteredNotes.length === 0"
    class="flex flex-col items-center justify-center text-center mt-12"
  >
    <img
      src="https://cdn-icons-png.flaticon.com/512/7486/7486740.png"
      class="w-32 h-32 opacity-70 mb-4"
    />
    <p class="text-gray-500 font-medium">
      No available notes yet
    </p>
    <p class="text-gray-400 text-sm mt-1">
      Tap + to create your first note
    </p>
  </div>

  <!-- Notes List -->
  <div
    v-for="note in filteredNotes"
    :key="note.id"
    @click="openNote(note)"
    class="flex items-center gap-4 py-4 border-b border-gray-100 cursor-pointer"
  >

    <div class="w-14 h-14 rounded-full p-[2px] bg-gray-300">
      <img :src="note.avatar" class="w-full h-full rounded-full object-cover">
    </div>

    <div class="flex-1">
      <div class="flex items-center justify-between">
        <h3 class="font-semibold text-gray-900">{{ note.title || "Untitled" }}</h3>
        <span class="text-sm text-gray-500">{{ note.time }}</span>
      </div>
      <p class="text-sm text-gray-500 truncate">
        {{ note.preview }}
      </p>
    </div>

  </div>

</div>

<!-- Floating Add Button (Black) -->
<button
  @click="goToAdd"
  class="fixed bottom-24 right-6 w-14 h-14 bg-black rounded-full text-white text-3xl shadow-lg"
>
+
</button>

<!-- Bottom Navigation -->
<div class="fixed bottom-4 left-1/2 -translate-x-1/2 w-[90%] bg-gray-100 rounded-3xl py-3 px-6 flex justify-between items-center shadow-inner">

  <div class="flex flex-col items-center text-black">
    <i data-lucide="home" class="w-6 h-6"></i>
    <span class="text-xs mt-1 font-medium">Home</span>
  </div>

  <div class="flex flex-col items-center text-gray-500">
    <i data-lucide="list-todo" class="w-6 h-6"></i>
    <span class="text-xs mt-1">To-do</span>
  </div>

  <div class="flex flex-col items-center text-gray-500">
    <i data-lucide="search" class="w-6 h-6"></i>
    <span class="text-xs mt-1">Search</span>
  </div>

  <div class="flex flex-col items-center text-gray-500">
    <i data-lucide="settings" class="w-6 h-6"></i>
    <span class="text-xs mt-1">Settings</span>
  </div>

</div>

</div>

<script>
const { createApp, nextTick } = Vue;

createApp({
  data() {
    return {
      searchQuery: "",
      avatars: [
        "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSCEara7G48B9wBtepw0qgCmiO5tAJ-Wi8BkQY5MyGD-Q&s=10",
        "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ4f9RoG_fkyBxyk781W8TntGFLLoV1_cMZwAkHn7dpbA&s=10",
        "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQUzo1zAHd99e2JRtJZASAfSj6Qb8NCgG1Y6QKLm01WQQ&s=10",
        "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQuaN0PlI1IkISNfGrHEfMjtXQzjcvVtLHIyPKi2uCUkA&s=10",
        "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRtrjiqv4JT8YP1NWXZkMEM1j5xmXCQ31ex6m5EFkYdMA&s=10",
        "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSpehW36y2RYXr_L5BFQDA4GBYjpdmAdwlP33-1nmLfOA&s=10"
      ],
      notes: []
    }
  },

  computed: {
    filteredNotes() {
      if (!this.searchQuery) return this.notes;
      const q = this.searchQuery.toLowerCase();
      return this.notes.filter(n =>
        (n.title || "").toLowerCase().includes(q) ||
        (n.preview || "").toLowerCase().includes(q)
      );
    },

    activeNotes() {
      return this.notes.slice(0, 8);
    }
  },

  methods: {
    loadNotes() {
      const saved = JSON.parse(localStorage.getItem("notes") || "[]");

      this.notes = saved.map(n => ({
        ...n,
        avatar: this.randomAvatar(),
        preview: (n.content && n.content[0]) || "",
        time: "Now"
      })).reverse();
    },

    randomAvatar() {
      return this.avatars[Math.floor(Math.random() * this.avatars.length)];
    },

    openNote(note) {
      localStorage.setItem("activeNote", note.id);
      window.location.href = "view.html";
    },

    goToAdd() {
      window.location.href = "chat.html";
    }
  },

  mounted() {
    this.loadNotes();

    nextTick(() => {
      lucide.createIcons();
    });
  }
}).mount("#app");
</script>

</body>
</html>
