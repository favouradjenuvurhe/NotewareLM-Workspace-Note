<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NotewareLM — Settings</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<style>
body {
  background:#e5e5e5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
</style>
</head>

<body class="flex items-center justify-center min-h-screen">

<div id="app"
class="w-[390px] h-[820px] bg-white rounded-[40px] shadow-2xl relative overflow-hidden flex flex-col">

<!-- Status Bar -->
<div class="flex items-center justify-between px-6 pt-4 text-sm font-medium">
  <span>7:20</span>
  <div class="w-28 h-6 bg-black rounded-full"></div>
  <div class="flex items-center gap-1">
    <i data-lucide="wifi" class="w-4 h-4"></i>
    <i data-lucide="battery" class="w-5 h-5"></i>
  </div>
</div>

<!-- Header -->
<div class="px-6 mt-4">
  <h1 class="text-xl font-bold">Settings</h1>
</div>

<!-- Content -->
<div class="flex-1 overflow-y-auto px-6 mt-4 space-y-4">

  <!-- Profile -->
  <div class="bg-gray-100 rounded-2xl p-4 flex items-center gap-4">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTMSjPec7ajbtAlfAQUZfKeQVqVmASLRDvTEOyvo_Rrpw&s=10"
         class="w-14 h-14 rounded-full object-cover">
    <div>
      <h2 class="font-semibold">Favour Adjenuvurhe</h2>
      <p class="text-sm text-gray-500">favour-amaaavl@outlook.com</p>
    </div>
  </div>

  <!-- Preferences -->
  <div class="bg-gray-50 rounded-2xl p-4 space-y-4">

    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <i data-lucide="moon"></i>
        <span>Dark Mode</span>
      </div>

      <button @click="darkMode=!darkMode"
      class="w-12 h-7 rounded-full transition"
      :class="darkMode ? 'bg-black' : 'bg-gray-300'">

        <div class="w-5 h-5 bg-white rounded-full shadow
        transform transition m-1"
        :class="darkMode ? 'translate-x-5' : ''"></div>

      </button>
    </div>

    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <i data-lucide="bell"></i>
        <span>Notifications</span>
      </div>

      <button @click="notifications=!notifications"
      class="w-12 h-7 rounded-full transition"
      :class="notifications ? 'bg-black' : 'bg-gray-300'">

        <div class="w-5 h-5 bg-white rounded-full shadow
        transform transition m-1"
        :class="notifications ? 'translate-x-5' : ''"></div>

      </button>
    </div>

  </div>

  <!-- Storage -->
  <div class="bg-gray-50 rounded-2xl p-4">
    <div class="flex items-center gap-3 mb-2">
      <i data-lucide="hard-drive"></i>
      <span class="font-semibold">Storage</span>
    </div>

    <div class="w-full bg-gray-200 rounded-full h-2">
      <div class="bg-black h-2 rounded-full w-1/2"></div>
    </div>

    <p class="text-sm text-gray-500 mt-2">
      50% used — 500MB of 1GB
    </p>
  </div>

  <!-- About -->
  <div class="bg-gray-50 rounded-2xl p-4 space-y-3">

    <div class="flex items-center gap-3">
      <i data-lucide="info"></i>
      <span>About NotewareLM</span>
    </div>

    <div class="flex items-center gap-3">
      <i data-lucide="shield"></i>
      <span>Privacy Policy</span>
    </div>

    <div class="flex items-center gap-3 text-red-500">
      <i data-lucide="log-out"></i>
      <span>Logout</span>
    </div>

  </div>

</div>

<!-- Bottom Navigation -->
<div class="absolute bottom-6 left-1/2 -translate-x-1/2
w-[90%] bg-gray-100 rounded-3xl py-3 px-6 flex justify-between shadow-inner">

  <div class="flex flex-col items-center text-gray-500">
    <i data-lucide="home" class="w-6 h-6"></i>
    <span class="text-xs mt-1">Home</span>
  </div>

  <div class="flex flex-col items-center text-gray-500">
    <i data-lucide="list-todo" class="w-6 h-6"></i>
    <span class="text-xs mt-1">To-do</span>
  </div>

  <div class="flex flex-col items-center text-gray-500">
    <i data-lucide="search" class="w-6 h-6"></i>
    <span class="text-xs mt-1">Search</span>
  </div>

  <div class="flex flex-col items-center text-black">
    <i data-lucide="settings" class="w-6 h-6"></i>
    <span class="text-xs mt-1 font-medium">Settings</span>
  </div>

</div>

<!-- Home Indicator -->
<div class="absolute bottom-1 left-1/2 -translate-x-1/2
w-32 h-1.5 bg-black rounded-full"></div>

</div>

<script>
const { createApp, nextTick } = Vue;

createApp({
  data() {
    return {
      darkMode:false,
      notifications:true
    }
  },

  mounted() {
    nextTick(()=>lucide.createIcons());
  }
}).mount("#app");
</script>

</body>
  </html>
