<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chat Notepad</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<style>
body {
  background: #e5e5e5;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

/* App animations */
.fade-enter-active,
.fade-leave-active {
  transition: all 0.25s ease;
}
.fade-enter-from {
  opacity: 0;
  transform: translateY(8px);
}
.fade-leave-to {
  opacity: 0;
}
</style>
</head>

<body>

<div id="app" class="w-full min-h-screen bg-white flex flex-col">

<!-- HEADER -->
<div class="px-6 mt-4 flex items-center gap-3">

<button onclick="history.back()" class="w-11 h-11 rounded-full bg-gray-100 flex items-center justify-center">
<i data-lucide="chevron-left" class="w-5 h-5"></i>
</button>

<div class="flex-1">
<h2 class="font-semibold text-gray-900">
Title: {{ activeNote?.title || "[ Title Not Created ]" }}
</h2>

<p class="text-sm text-gray-500">
Revision Note
</p>
</div>

<button @click="toggleBookmark"
class="w-11 h-11 rounded-full bg-gray-100 flex items-center justify-center">

<i :data-lucide="activeNote?.features ? 'bookmark-check' : 'bookmark'" class="w-5 h-5"></i>

</button>

</div>

<!-- WELCOME -->
<div v-if="chat.length === 0"
class="flex flex-col items-center justify-center flex-1 text-center text-gray-500">

<div class="w-20 h-20 rounded-full bg-gray-100 flex items-center justify-center mb-4">
<i data-lucide="message-circle" class="w-10 h-10"></i>
</div>

<p class="font-semibold">Start chatting with LU_LU</p>
<p class="text-sm">Type anything to begin</p>

</div>

<!-- CHAT -->
<div v-else ref="chatBox" class="flex-1 overflow-y-auto px-6 mt-4 space-y-3">

<transition-group name="fade">

<div v-for="msg in chat" :key="msg.id"
class="flex"
:class="msg.type==='out'?'justify-end':'justify-start'">

<div class="max-w-[260px]">

<div class="px-4 py-3 rounded-2xl text-sm whitespace-pre-line"
:class="msg.type==='out'?'bg-black text-white':'bg-gray-100 text-gray-900'">

{{ msg.text }}

</div>

<div class="text-xs text-gray-400 mt-1"
:class="msg.type==='out'?'text-right':'text-left'">

{{ msg.time }}

</div>

</div>
</div>

</transition-group>

</div>

<!-- INPUT -->
<div class="px-4 pb-6">

<div class="bg-gray-100 rounded-3xl flex items-center px-3 py-2">

<input
v-model="input"
@keyup.enter="send"
placeholder="Write a note..."
class="flex-1 px-3 outline-none bg-transparent text-sm"
/>

<button @click="send"
class="w-10 h-10 rounded-full bg-black text-white flex items-center justify-center">

<i data-lucide="send" class="w-5 h-5"></i>

</button>

</div>

</div>

</div>

<script>
const { createApp, nextTick } = Vue;

createApp({

data(){
return{
input:"",
chat:[],
notes: JSON.parse(localStorage.getItem("notes")||"[]"),
activeNote:null,
state:"idle",
greeted:false
}
},

methods:{

time(){
return new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
},

today(){
return new Date().toLocaleDateString();
},

saveNotes(){
localStorage.setItem("notes", JSON.stringify(this.notes));
},

addBot(text,delay=400){

setTimeout(()=>{
this.chat.push({
id:Date.now()+Math.random(),
text,
type:"in",
time:this.time()
});

this.scroll();

},delay);
},

addUser(text){
this.chat.push({
id:Date.now(),
text,
type:"out",
time:this.time()
});
},

scroll(){
nextTick(()=>{
if(this.$refs.chatBox){
this.$refs.chatBox.scrollTo({
top:this.$refs.chatBox.scrollHeight,
behavior:"smooth"
});
}
lucide.createIcons();
});
},

detectList(text){
return /^\d+\.\s/.test(text);
},

createNote(title,status="public"){

const now=Date.now();

const note={
id:now,
title,
content:[],
created:now,
date:this.today(),
time:this.time(),
status,
features:0
};

this.activeNote=note;
this.notes.push(note);
this.saveNotes();
},

toggleBookmark(){

if(!this.activeNote) return;

this.activeNote.features = this.activeNote.features ? 0 : 1;

const i=this.notes.findIndex(n=>n.id===this.activeNote.id);
if(i!==-1) this.notes[i]=this.activeNote;

this.saveNotes();

this.addBot(
this.activeNote.features
? "Pinned to favorites ⭐"
: "Removed from favorites"
);

},

autoSave(){

if(!this.activeNote) return;

const i=this.notes.findIndex(n=>n.id===this.activeNote.id);
if(i!==-1) this.notes[i]=this.activeNote;

this.saveNotes();

},

writingReply(){

const replies=[
"Got it. Keep going 👍",
"Saved. What else?",
"I'm listening…",
"Nice. Continue writing ✍️",
"Added to your note ✔"
];

return replies[Math.floor(Math.random()*replies.length)];
},

send(){

const text=this.input.trim();
if(!text) return;

this.input="";
this.addUser(text);

if(!this.greeted){
this.greeted=true;
this.addBot("Hi, I'm LU_LU! Create new note OR type Continue with note title");
return;
}

const lower=text.toLowerCase();

if(lower==="save"){
this.autoSave();
this.addBot("Saved ✔");
}

else if(lower==="end note"){
this.state="idle";
this.activeNote=null;
this.addBot("Note closed.");
}

else if(this.state==="idle"){

if(lower.includes("create")){
this.state="title";
this.addBot("Title please");
}
else if(lower.includes("continue")){
this.state="continue";
this.addBot("Send note title");
}
else{
this.addBot("Type Create or Continue");
}

}

else if(this.state==="title"){
this.createNote(text);
this.state="writing";
this.addBot("Start writing your note");
}

else if(this.state==="writing"){

if(this.detectList(text)){
this.activeNote.content.push("• "+text.replace(/^\d+\.\s/,""));
}
else{
this.activeNote.content.push(text);
}

this.autoSave();
this.addBot(this.writingReply());

}

else if(this.state==="continue"){

const found=this.notes.find(n=>n.title===text);

if(found){
this.activeNote=found;
this.state="writing";
this.addBot("Continue writing");
}
else{
this.addBot("Note not found");
this.state="idle";
}

}

this.scroll();

}

},

mounted(){
nextTick(()=>lucide.createIcons());
}

}).mount("#app");
</script>

</body>
</html>
