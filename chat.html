<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chat Notepad</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
body { background: #e5e5e5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
</style>
</head>
<body>

<div id="app"
class="w-full min-h-screen bg-white relative overflow-hidden flex flex-col">

<!-- Header -->
<div class="px-6 mt-4 flex items-center gap-3">
  <button class="w-11 h-11 rounded-full bg-gray-100 flex items-center justify-center">
    <i data-lucide="chevron-left" class="w-5 h-5"></i>
  </button>

  <div class="flex-1">
    <h2 class="font-semibold text-gray-900">
      Title: {{ title || "[ Title Not Created ]" }}
    </h2>
    <p class="text-sm text-gray-500">
      {{ subtitle || "Revision Note" }}
    </p>
  </div>

  <button
    @click="toggleBookmark"
    class="w-11 h-11 rounded-full bg-gray-100 flex items-center justify-center">
    <i :data-lucide="bookmarked ? 'bookmark-check' : 'bookmark'" class="w-5 h-5"></i>
  </button>
</div>

<!-- Messages -->
<div ref="chatBox" class="flex-1 overflow-y-auto px-6 mt-4 space-y-3">

  <div v-for="note in notes" :key="note.id" class="flex"
       :class="note.type === 'out' ? 'justify-end' : 'justify-start'">
    <div class="max-w-[260px]">
      <div class="px-4 py-3 rounded-2xl text-sm"
           :class="note.type === 'out' ? 'bg-black text-white' : 'bg-gray-100 text-gray-900'">
        {{ note.text }}
      </div>
      <div class="text-xs text-gray-400 mt-1 flex items-center gap-1"
           :class="note.type === 'out' ? 'justify-end' : 'justify-start'">
        {{ note.time }}
        <i v-if="note.type==='out'" data-lucide="check-check" class="w-4 h-4"></i>
      </div>
    </div>
  </div>

</div>

<!-- Input -->
<div class="px-4 pb-6">
  <div class="bg-gray-100 rounded-3xl flex items-center px-3 py-2">

    <button class="w-10 h-10 rounded-full bg-white flex items-center justify-center">
      <i data-lucide="plus" class="w-5 h-5"></i>
    </button>

    <input
      v-model="newNote"
      @keyup.enter="sendNote"
      placeholder="Write a note..."
      class="flex-1 px-3 outline-none bg-transparent text-sm"
    />

    <button @click="sendNote"
      class="w-10 h-10 rounded-full bg-black flex items-center justify-center text-white">
      <i data-lucide="send" class="w-5 h-5"></i>
    </button>

  </div>
</div>
</div>

<script>
const { createApp, nextTick } = Vue;

createApp({
data() {
  return {
    newNote: "",
    title: localStorage.getItem("title") || "",
    subtitle: localStorage.getItem("subtitle") || "",
    bookmarked: JSON.parse(localStorage.getItem("bookmarked") || "false"),
    notes: JSON.parse(localStorage.getItem("notes") || "[]"),
    mode: "welcome",
    activeNoteId: null
  }
},

methods: {

timeNow() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
},

saveData() {
  localStorage.setItem("notes", JSON.stringify(this.notes));
  localStorage.setItem("title", this.title);
  localStorage.setItem("subtitle", this.subtitle);
  localStorage.setItem("bookmarked", this.bookmarked);
},

addBot(text) {
  this.notes.push({ id: Date.now()+Math.random(), text, type: "in", time: this.timeNow() });
  this.saveData();
},

addUser(text) {
  this.notes.push({ id: Date.now(), text, type: "out", time: this.timeNow() });
  this.saveData();
},

randomReply(msg) {
  const replies = [
    "Nice flow — keep going.",
    "I’m organizing this neatly.",
    "That’s a strong point.",
    "Good paragraph — continue.",
    "I understand, keep writing."
  ];
  if(msg.endsWith("?")) return "Interesting question. Keep going — I'm organizing your ideas.";
  if(msg.endsWith(".")) return replies[Math.floor(Math.random()*replies.length)];
  return "Got it. Continue writing — I'm formatting your notes.";
},

sendNote() {
  const msg = this.newNote.trim();
  if(!msg) return;

  this.addUser(msg);
  this.newNote = "";

  const lower = msg.toLowerCase();

  if(this.mode === "welcome") {
    if(lower.includes("create")) { this.mode="title"; this.addBot("Great! Kindly send title please."); }
    else if(lower.includes("continue")) { this.mode="paragraph"; this.addBot("Sure — continue typing your notes. I'm listening."); }
    else { this.addBot("Please reply with Create Note or Continue Note so I can assist you."); }
  } 
  else if(this.mode === "title") { this.title = msg; this.mode="subtitle"; this.addBot("Nice title 👍 Kindly send subtitle please."); }
  else if(this.mode === "subtitle") { this.subtitle = msg; this.mode="paragraph"; this.addBot("Perfect. You can now start sending paragraphs."); }
  else if(this.mode === "paragraph") { this.addBot(this.randomReply(msg)); }

  nextTick(() => { this.$refs.chatBox.scrollTop = this.$refs.chatBox.scrollHeight; lucide.createIcons(); });
},

toggleBookmark() {
  this.bookmarked = !this.bookmarked;
  this.addBot(this.bookmarked ? "This note has been saved as a featured note ⭐" : "Featured note removed.");
  this.saveData();
}

},

mounted() {
  if(this.notes.length===0){
    this.addBot("Hi, I'm LU_LU! How are you?\nKindly respond with Create Note or Continue Note to begin.");
  }
  nextTick(()=>lucide.createIcons());
}

}).mount("#app");
</script>

</body>
</html>
