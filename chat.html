<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chat Notepad</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<style>
body {
  background: #e5e5e5;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
</style>
</head>

<body>

<div id="app" class="w-full min-h-screen bg-white flex flex-col">

<!-- Header -->
<div class="px-6 mt-4 flex items-center gap-3">
  <button onclick="history.back()" class="w-11 h-11 rounded-full bg-gray-100 flex items-center justify-center">
    <i data-lucide="chevron-left" class="w-5 h-5"></i>
  </button>

  <div class="flex-1">
    <h2 class="font-semibold text-gray-900">
      {{ activeNote?.title || "[ No Note Selected ]" }}
    </h2>
    <p class="text-sm text-gray-500">
      {{ activeNote ? activeNote.created : "Chat Notepad" }}
    </p>
  </div>
</div>

<!-- Welcome Screen -->
<div v-if="messages.length === 0"
class="flex flex-col items-center justify-center flex-1 text-center text-gray-500">

<div class="w-20 h-20 rounded-full bg-gray-100 flex items-center justify-center mb-4">
<i data-lucide="message-circle" class="w-10 h-10"></i>
</div>

<p class="font-semibold">Start chatting with LU_LU</p>
<p class="text-sm">Type <b>Create</b> or <b>Continue</b></p>

</div>

<!-- Messages -->
<div v-else ref="chatBox"
class="flex-1 overflow-y-auto px-6 mt-4 space-y-3">

<div v-for="m in messages" :key="m.id"
class="flex"
:class="m.type==='user'?'justify-end':'justify-start'">

<div class="max-w-[260px]">

<div class="px-4 py-3 rounded-2xl text-sm"
:class="m.type==='user'?'bg-black text-white':'bg-gray-100 text-gray-900'">
{{ m.text }}
</div>

<div class="text-xs text-gray-400 mt-1">
{{ m.time }}
</div>

</div>
</div>
</div>

<!-- Input -->
<div class="px-4 pb-6">
<div class="bg-gray-100 rounded-3xl flex items-center px-3 py-2">

<input
v-model="input"
@keyup.enter="send"
placeholder="Write a note..."
class="flex-1 px-3 outline-none bg-transparent text-sm"
/>

<button @click="send"
class="w-10 h-10 rounded-full bg-black text-white flex items-center justify-center">
<i data-lucide="send" class="w-5 h-5"></i>
</button>

</div>
</div>

</div>

<script>
const { createApp, nextTick } = Vue;

createApp({

data() {
return {
input: "",
messages: [],
notes: JSON.parse(localStorage.getItem("notes") || "[]"),
activeNote: null,
state: "idle"
}
},

methods: {

time() {
return new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
},

saveNotes() {
localStorage.setItem("notes", JSON.stringify(this.notes));
},

bot(text) {
this.messages.push({id:Date.now()+Math.random(), text, type:"bot", time:this.time()});
},

user(text) {
this.messages.push({id:Date.now(), text, type:"user", time:this.time()});
},

send() {
const text = this.input.trim();
if(!text) return;

this.user(text);
this.input = "";

const lower = text.toLowerCase();

if(this.state==="idle"){

if(lower.includes("create")){
this.state="title";
this.bot("Send title for new note.");

}

else if(lower.includes("continue")){
this.state="continue";
this.bot("Send exact note title.");

}

else{
this.bot("Type Create or Continue.");
}

}

else if(this.state==="title"){

this.activeNote={
id:Date.now(),
title:text,
content:[],
created:new Date().toLocaleString()
};

this.state="writing";
this.bot("Start writing.");

}

else if(this.state==="continue"){

const found=this.notes.find(n=>n.title===text);

if(found){
this.activeNote=found;
this.state="writing";
this.bot("Continuing note.");
}
else{
this.bot("Note not found.");
this.state="idle";
}

}

else if(this.state==="writing"){

if(lower==="save"){
this.finishNote();
return;
}

if(lower==="delete note"){
this.deleteNote();
return;
}

this.activeNote.content.push(text);

const replies=[
"Saved.",
"Added.",
"Got it.",
"Continue.",
"Writing stored."
];

this.bot(replies[Math.floor(Math.random()*replies.length)]);

}

this.scroll();

},

finishNote(){

if(!this.activeNote) return;

const exists=this.notes.find(n=>n.id===this.activeNote.id);

if(!exists) this.notes.push(this.activeNote);

this.saveNotes();
this.bot("Note saved. Returning home.");
setTimeout(()=>window.location.href="index.html",800);

},

deleteNote(){

if(!this.activeNote) return;

this.notes=this.notes.filter(n=>n.id!==this.activeNote.id);
this.saveNotes();

this.bot("Note deleted.");
this.activeNote=null;
this.state="idle";

},

scroll(){
nextTick(()=>{
this.$refs.chatBox?.scrollTo(0,this.$refs.chatBox.scrollHeight);
lucide.createIcons();
});
}

},

mounted(){
nextTick(()=>lucide.createIcons());
}

}).mount("#app");
</script>

</body>
</html>
